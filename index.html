<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nối từ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--ink:#14213d;--mute:#5b6679;--card:#fff;--line:#d5dce8;--green:#2e7d5b;--gold:#f2b705;--red:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--ink:#e8edf6;--mute:#93a0b8;--card:#18223a;--line:#2a3856;--green:#4cc38a;--red:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:32px 20px 56px}
h1{font-size:2.4rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 24px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}
.now{font-size:2.6rem;font-weight:800;letter-spacing:-.01em;margin:4px 0}
.now b{background:var(--gold);color:#14213d;border-radius:8px;padding:0 10px}
.need{color:var(--mute);margin:0}
.need strong{color:var(--ink)}
.row{display:flex;gap:8px;margin-top:20px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:3px solid var(--green);outline-offset:1px;border-color:var(--green)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--green);color:#fff}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled,input:disabled{opacity:.5;cursor:not-allowed}
.msg{min-height:1.6em;margin:12px 0 0;font-weight:600}
.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:16px;color:var(--mute);font-size:.95rem}
.tools label{display:flex;gap:8px;align-items:center;cursor:pointer}
.score{font-weight:600;color:var(--ink)}
h2{font-size:1.05rem;margin:28px 0 10px}
.chain{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chain li{display:flex;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--card);font-weight:600}
.chain span{padding:5px 11px}
.chain .link{background:var(--gold);color:#14213d}
.chain li.me{border-color:var(--green)}
.chain li.me span:last-child{color:var(--green)}
.empty{color:var(--mute)}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:16px}
button.on{background:var(--green);color:#fff;border-color:var(--green)}
#plist{list-style:none;padding:0;margin:12px 0;text-align:left}
#plist li{padding:6px 0;border-bottom:1px solid var(--line)}
.small{font-size:.9rem;color:var(--mute);margin:8px 0 0}
</style>
</head>
<body>
<main>
  <h1>Nối từ</h1>
  <p class="sub">Từ của bạn phải bắt đầu bằng tiếng cuối của từ trước, và gồm đúng 2 tiếng.</p>

  <div class="tabs">
    <button type="button" id="tsolo" class="alt on">Chơi với máy</button>
    <button type="button" id="tonline" class="alt">Chơi online</button>
  </div>
<div id="solo">
  <section class="stage" aria-live="polite">
    <p class="need" id="need">Đang chuẩn bị…</p>
    <div class="now" id="now"></div>
    <form class="row" id="form" autocomplete="off">
      <input type="text" id="word" placeholder="Nhập từ 2 tiếng" aria-label="Từ của bạn" autofocus>
      <button type="submit" id="send">Nối</button>
    </form>
    <p class="msg" id="msg"></p>
    <div class="tools">
      <span class="score" id="score">Bạn nối được: 0 từ</span>
      <label><input type="checkbox" id="any"> Chấp nhận mọi từ 2 tiếng</label>
    </div>
    <div class="row">
      <button type="button" class="alt" id="hint">Gợi ý</button>
      <button type="button" class="alt" id="giveup">Bỏ cuộc</button>
      <button type="button" class="alt" id="again">Chơi lại</button>
    </div>
  </section>

  <h2>Chuỗi từ</h2>
  <ol class="chain" id="chain"><li class="empty">Chưa có từ nào.</li></ol>
</div>

<div id="online" hidden>
  <section class="stage" aria-live="polite">
    <div id="lobby">
      <p class="need">Chơi cùng bạn bè, mỗi người một thiết bị. Một người tạo phòng, những người còn lại nhập mã phòng.</p>
      <div class="row"><input type="text" id="oname" placeholder="Tên của bạn" maxlength="16" aria-label="Tên của bạn"></div>
      <div class="row"><button type="button" id="mk">Tạo phòng</button></div>
      <div class="row"><input type="text" id="ocode" placeholder="Mã phòng" maxlength="5" aria-label="Mã phòng"><button type="button" id="jn" class="alt">Vào phòng</button></div>
    </div>
    <div id="room" hidden>
      <p class="need">Mã phòng: <strong id="rcode"></strong></p>
      <div class="row"><input type="text" id="link" readonly aria-label="Link mời bạn bè"><button type="button" id="copy" class="alt">Sao chép link</button></div>
      <ul id="plist"></ul>
      <div id="hostbar">
        <div class="row"><button type="button" id="start">Bắt đầu</button></div>
        <label class="small"><input type="checkbox" id="oany" checked> Chấp nhận mọi từ 2 tiếng</label>
      </div>
      <div class="now" id="onow"></div>
      <p class="need" id="oturn"></p>
      <p class="small" id="otime"></p>
      <form class="row" id="oform" autocomplete="off">
        <input type="text" id="oword" placeholder="Nhập từ 2 tiếng" aria-label="Từ của bạn">
        <button type="submit">Nối</button>
      </form>
      <div class="row">
        <button type="button" class="alt" id="oquit">Chịu thua</button>
        <button type="button" class="alt" id="oleave">Rời phòng</button>
      </div>
    </div>
    <p class="msg" id="omsg"></p>
  </section>
  <h2>Chuỗi từ</h2>
  <ol class="chain" id="ochain"><li class="empty">Chưa có từ nào.</li></ol>
</div>
</main>

const norm = s => s.normalize("NFC").toLowerCase().trim().replace(/\s+/g, " ");
const WORDS = [...new Set(RAW.split(",").map(norm).filter(w => w.split(" ").length === 2))];
const byStart = {};
WORDS.forEach(w => { const [a] = w.split(" "); (byStart[a] = byStart[a] || []).push(w); });

const $ = id => document.getElementById(id);
let used, chain, last, over, mine;

const free = syl => (byStart[syl] || []).filter(w => !used.has(w));
const tail = w => w.split(" ")[1];

function render() {
  const ol = $("chain");
  ol.innerHTML = "";
  if (!chain.length) { ol.innerHTML = '<li class="empty">Chưa có từ nào.</li>'; return; }
  chain.forEach(c => {
    const li = document.createElement("li");
    if (c.me) li.className = "me";
    const [a, b] = c.w.split(" ");
    const s1 = document.createElement("span"); s1.className = "link"; s1.textContent = a;
    const s2 = document.createElement("span"); s2.textContent = b;
    li.append(s1, s2); ol.append(li);
  });
  $("score").textContent = "Bạn nối được: " + mine + " từ";
}

function show(w) {
  const [a, b] = w.split(" ");
  $("now").innerHTML = "";
  $("now").append(a + " ");
  const bt = document.createElement("b"); bt.textContent = b; $("now").append(bt);
  $("need").innerHTML = "";
  $("need").append("Nối tiếp bằng tiếng ");
  const st = document.createElement("strong"); st.textContent = "“" + b + "”"; $("need").append(st);
}

function say(text, kind) { const m = $("msg"); m.textContent = text; m.className = "msg " + (kind || ""); }

function setOver(text, kind) {
  over = true; say(text, kind);
  $("word").disabled = true; $("send").disabled = true; $("hint").disabled = true; $("giveup").disabled = true;
  $("again").focus();
}

function add(w, isMe) { used.add(w); chain.push({ w, me: isMe }); last = tail(w); if (isMe) mine++; show(w); render(); }

function machineTurn() {
  const opts = free(last);
  if (!opts.length) return setOver("Máy bí rồi, bạn thắng! Bạn nối được " + mine + " từ.", "ok");
  const ranked = opts.map(w => ({ w, n: free(tail(w)).filter(x => x !== w).length }))
                     .sort((x, y) => x.n - y.n);
  const pick = ranked[Math.floor(Math.random() * Math.min(3, ranked.length))].w;
  add(pick, false);
  say("Máy nối: " + pick + ". Đến lượt bạn.");
  $("word").focus();
}

function start() {
  used = new Set(); chain = []; mine = 0; over = false; last = null;
  $("word").disabled = false; $("send").disabled = false; $("hint").disabled = false; $("giveup").disabled = false;
  $("word").value = "";
  const first = WORDS[Math.floor(Math.random() * WORDS.length)];
  add(first, false); mine = 0; render();
  say("Máy mở đầu. Đến lượt bạn.");
  $("word").focus();
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  if (over) return;
  const w = norm($("word").value);
  const parts = w.split(" ");
  if (!w) return say("Hãy nhập một từ.", "err");
  if (parts.length !== 2) return say("Từ phải gồm đúng 2 tiếng, ví dụ: " + chain[chain.length - 1].w, "err");
  if (parts[0] !== last) return say("Từ phải bắt đầu bằng tiếng “" + last + "”.", "err");
  if (used.has(w)) return say("Từ này đã dùng rồi, hãy chọn từ khác.", "err");
  if (!WORDS.includes(w) && !$("any").checked) return say("Từ này chưa có trong từ điển của trò chơi. Bật “Chấp nhận mọi từ 2 tiếng” nếu bạn chắc từ đúng.", "err");
  $("word").value = "";
  add(w, true);
  say("Máy đang nghĩ…");
  setTimeout(machineTurn, 500);
});

$("hint").addEventListener("click", () => {
  const opts = free(last);
  say(opts.length ? "Gợi ý: " + opts[Math.floor(Math.random() * opts.length)] : "Trong từ điển không còn từ nào để gợi ý.", opts.length ? "" : "err");
});
$("giveup").addEventListener("click", () => setOver("Bạn đã bỏ cuộc. Bạn nối được " + mine + " từ.", ""));
$("again").addEventListener("click", start);
start();
</script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  const CH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const code5 = () => Array.from({ length: 5 }, () => CH[Math.floor(Math.random() * CH.length)]).join("");
  let peer = null, isHost = false, myId = "host", myName = "", hostConn = null, G = null, S = null, tleft = 0, inRoom = false;
  const conns = {};
  const msg = (t, k) => { const m = $("omsg"); m.textContent = t || ""; m.className = "msg " + (k || ""); };

  function mode(on) {
    $("solo").hidden = on; $("online").hidden = !on;
    $("tsolo").classList.toggle("on", !on); $("tonline").classList.toggle("on", on);
  }
  $("tsolo").onclick = () => mode(false);
  $("tonline").onclick = () => mode(true);

  function enterRoom(code) {
    inRoom = true; $("lobby").hidden = true; $("room").hidden = false;
    $("rcode").textContent = code;
    $("link").value = location.origin + location.pathname + "?room=" + code;
    msg("");
  }

  function render(s) {
    S = s;
    const cur = s.players[s.turn];
    const mine = s.started && !s.over && cur && cur.id === myId;
    const me = s.players.find(p => p.id === myId);
    const ul = $("plist"); ul.innerHTML = "";
    s.players.forEach((p, i) => {
      const li = document.createElement("li");
      li.textContent = p.name + (p.id === myId ? " (bạn)" : "") + (p.alive ? "" : " — đã bị loại") +
        (s.started && !s.over && p.alive && i === s.turn ? " — đến lượt" : "");
      ul.append(li);
    });
    $("hostbar").hidden = !(isHost && (!s.started || s.over));
    $("start").textContent = s.over ? "Chơi ván mới" : "Bắt đầu";
    $("start").disabled = s.players.length < 2;
    $("oany").checked = s.any;
    const last = s.chain[s.chain.length - 1];
    $("onow").textContent = last ? last.w : "";
    $("oturn").textContent = !s.started ? "Chờ chủ phòng bắt đầu (cần ít nhất 2 người)…"
      : s.over ? "Hết trò! " + (s.winner || "Không ai") + " thắng."
      : mine ? "Đến lượt bạn, nối bằng tiếng “" + s.last + "”"
      : "Đến lượt " + (cur ? cur.name : "") + ", nối bằng tiếng “" + s.last + "”";
    $("oform").hidden = !mine;
    $("oquit").hidden = !(s.started && !s.over && me && me.alive);
    if (mine) $("oword").focus();
    tleft = s.started && !s.over ? s.secs : 0;
    $("otime").textContent = tleft ? "Còn " + tleft + " giây" : "";
    const ol = $("ochain"); ol.innerHTML = "";
    if (!s.chain.length) ol.innerHTML = '<li class="empty">Chưa có từ nào.</li>';
    s.chain.forEach(c => {
      const li = document.createElement("li"); li.title = c.by;
      const [a, b] = c.w.split(" ");
      const s1 = document.createElement("span"); s1.className = "link"; s1.textContent = a;
      const s2 = document.createElement("span"); s2.textContent = b;
      li.append(s1, s2); ol.append(li);
    });
    if (s.note) msg(s.note);
  }
  setInterval(() => {
    if (S && S.started && !S.over && tleft > 0) { tleft--; $("otime").textContent = "Còn " + tleft + " giây"; }
  }, 1000);

  /* ---------- Chủ phòng: giữ trạng thái và kiểm tra luật ---------- */
  const pub = () => ({
    code: G.code, players: G.players.map(p => ({ id: p.id, name: p.name, alive: p.alive })),
    started: G.started, over: G.over, turn: G.turn, chain: G.chain, last: G.last,
    any: G.any, winner: G.winner, note: G.note || "", secs: 30
  });
  const toAll = o => Object.values(conns).forEach(c => { try { if (c.open) c.send(o); } catch (e) {} });
  function broadcast() { const s = pub(); toAll({ t: "state", s }); render(s); G.note = ""; }
  function sendTo(id, o) {
    if (id === "host") msg(o.m, "err");
    else if (conns[id]) { try { conns[id].send(o); } catch (e) {} }
  }
  function arm() { clearTimeout(G.tm); G.tm = setTimeout(() => kick(G.players[G.turn].id, "hết giờ"), 30000); }
  function next() {
    do { G.turn = (G.turn + 1) % G.players.length; } while (!G.players[G.turn].alive);
    arm(); broadcast();
  }
  function kick(id, why) {
    const p = G.players.find(x => x.id === id);
    if (!p || !p.alive || !G.started || G.over) return;
    p.alive = false; G.note = p.name + " bị loại (" + why + ").";
    const alive = G.players.filter(x => x.alive);
    if (alive.length <= 1) { G.over = true; G.winner = alive[0] ? alive[0].name : ""; clearTimeout(G.tm); return broadcast(); }
    if (G.players[G.turn].id === id) next(); else broadcast();
  }
  function submit(id, raw) {
    if (!G.started || G.over) return;
    const p = G.players[G.turn];
    if (p.id !== id) return sendTo(id, { t: "err", m: "Chưa đến lượt bạn." });
    const w = norm(raw || ""), parts = w.split(" ");
    if (parts.length !== 2) return sendTo(id, { t: "err", m: "Từ phải gồm đúng 2 tiếng." });
    if (parts[0] !== G.last) return sendTo(id, { t: "err", m: "Từ phải bắt đầu bằng tiếng “" + G.last + "”." });
    if (G.used.has(w)) return sendTo(id, { t: "err", m: "Từ này đã dùng rồi." });
    if (!G.any && !WORDS.includes(w)) return sendTo(id, { t: "err", m: "Từ này chưa có trong từ điển của trò chơi." });
    G.used.add(w); G.chain.push({ w, by: p.name }); G.last = tail(w);
    G.note = p.name + " nối: " + w + ".";
    next();
  }
  function begin() {
    if (G.players.length < 2) return msg("Cần ít nhất 2 người chơi.", "err");
    G.players.forEach(p => p.alive = true);
    const w = WORDS[Math.floor(Math.random() * WORDS.length)];
    G.used = new Set([w]); G.chain = [{ w, by: "Máy" }]; G.last = tail(w);
    G.started = true; G.over = false; G.winner = null; G.turn = 0; G.note = "Từ mở đầu do máy chọn.";
    arm(); broadcast();
  }
  function onHostData(c, d) {
    if (!d) return;
    if (d.t === "join") {
      if (G.started && !G.over) { c.send({ t: "err", m: "Phòng đã bắt đầu chơi, hãy chờ ván sau." }); return setTimeout(() => c.close(), 300); }
      if (G.players.length >= 8) { c.send({ t: "err", m: "Phòng đã đủ 8 người." }); return setTimeout(() => c.close(), 300); }
      if (G.players.some(p => p.id === c.peer)) return;
      G.players.push({ id: c.peer, name: String(d.name || "").slice(0, 16) || "Người chơi", alive: true });
      conns[c.peer] = c; G.note = ""; broadcast();
    } else if (d.t === "word") submit(c.peer, d.w);
    else if (d.t === "quit") kick(c.peer, "chịu thua");
  }
  function drop(c) {
    delete conns[c.peer];
    if (!G) return;
    if (G.started && !G.over) kick(c.peer, "mất kết nối");
    else { G.players = G.players.filter(p => p.id !== c.peer); broadcast(); }
  }
  function openRoom(n) {
    const code = code5();
    peer = new Peer("noitu-" + code);
    peer.on("open", () => {
      G = { code, players: [{ id: "host", name: myName, alive: true }], started: false, over: false, turn: 0, chain: [], used: new Set(), last: "", any: $("oany").checked, winner: null, note: "", tm: null };
      enterRoom(code); broadcast();
    });
    peer.on("connection", c => { c.on("data", d => onHostData(c, d)); c.on("close", () => drop(c)); });
    peer.on("error", e => {
      if (e.type === "unavailable-id" && n < 5) { peer.destroy(); openRoom(n + 1); }
      else msg("Không tạo được phòng (" + e.type + "). Thử lại sau.", "err");
    });
  }

  /* ---------- Người vào phòng ---------- */
  function joinRoom() {
    const code = $("ocode").value.trim().toUpperCase();
    if (code.length !== 5) return msg("Mã phòng gồm 5 ký tự.", "err");
    msg("Đang kết nối…");
    peer = new Peer();
    peer.on("open", id => {
      myId = id;
      hostConn = peer.connect("noitu-" + code, { reliable: true });
      const to = setTimeout(() => msg("Không kết nối được. Kiểm tra mã phòng hoặc thử mạng khác.", "err"), 12000);
      hostConn.on("open", () => { clearTimeout(to); hostConn.send({ t: "join", name: myName }); });
      hostConn.on("data", d => {
        if (d.t === "state") { if (!inRoom) enterRoom(code); render(d.s); }
        else if (d.t === "err") msg(d.m, "err");
      });
      hostConn.on("close", () => msg("Đã mất kết nối với chủ phòng.", "err"));
    });
    peer.on("error", e => msg(e.type === "peer-unavailable" ? "Không tìm thấy phòng này. Kiểm tra lại mã." : "Lỗi kết nối (" + e.type + ").", "err"));
  }

  /* ---------- Nút bấm ---------- */
  const ready = () => {
    if (typeof Peer === "undefined") { msg("Không tải được thư viện kết nối. Kiểm tra mạng rồi tải lại trang.", "err"); return false; }
    myName = $("oname").value.trim().slice(0, 16);
    if (!myName) { msg("Hãy nhập tên của bạn.", "err"); return false; }
    return true;
  };
  $("mk").onclick = () => { if (ready()) { isHost = true; myId = "host"; msg("Đang tạo phòng…"); openRoom(0); } };
  $("jn").onclick = () => { if (ready()) { isHost = false; joinRoom(); } };
  $("start").onclick = () => { if (isHost && G && (!G.started || G.over)) begin(); };
  $("oany").onchange = e => { if (isHost && G) { G.any = e.target.checked; broadcast(); } };
  $("oform").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("oword").value; $("oword").value = "";
    if (isHost) submit("host", v); else if (hostConn) hostConn.send({ t: "word", w: v });
  });
  $("oquit").onclick = () => { if (isHost) kick("host", "chịu thua"); else if (hostConn) hostConn.send({ t: "quit" }); };
  $("oleave").onclick = () => location.reload();
  $("copy").onclick = () => {
    const l = $("link"); l.select();
    try { navigator.clipboard.writeText(l.value); msg("Đã sao chép link. Gửi cho bạn bè nhé.", "ok"); } catch (e) { msg("Hãy bôi đen link và sao chép thủ công.", ""); }
  };

  const q = new URLSearchParams(location.search).get("room");
  if (q) { mode(true); $("ocode").value = q.toUpperCase().slice(0, 5); $("oname").focus(); }
})();
</script>
</body>
</html>
